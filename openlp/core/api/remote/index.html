<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#14171c">
<title>OpenLP</title>
<!--
  The web remote of the OpenLP Gemeinde-Edition: search, service and slides on one screen, everything with one tap.
  It uses the web API of OpenLP (api/v2) and its web socket for the live state.
-->
<link rel="stylesheet" href="remote.css">
</head>
<body>
<header class="top">
  <div class="search-row">
    <label class="search-box">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 0 1 5.6 11.2l4.6 4.6-1.4 1.4-4.6-4.6A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
      <input id="search" type="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             enterkeyhint="search">
      <button id="clear-search" class="clear" type="button" hidden aria-label="">&times;</button>
    </label>
    <button id="upload" class="upload" type="button" hidden>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 16V7.8l-3.3 3.3-1.4-1.4L12 4l5.7 5.7-1.4 1.4L13 7.8V16h-2zm-6 2h14v2H5v-2z"/></svg>
      <span class="label"></span>
    </button>
    <input id="upload-file" type="file" hidden
           accept=".pptx,.ppt,.pps,.ppsx,.pptm,.odp,.otp,.pdf,.key,.xps,.oxps,.epub,.cbz,.fb2">
  </div>
  <nav id="categories" class="categories"></nav>
</header>

<section id="results" class="results" hidden>
  <ul id="result-list"></ul>
</section>

<main class="main">
  <aside class="service">
    <h2 id="service-title"></h2>
    <ul id="service-list"></ul>
  </aside>
  <section class="slides">
    <div class="slides-head">
      <h2 id="item-title"></h2>
      <button id="stop" class="stop" type="button" hidden>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>
        <span class="label"></span>
      </button>
    </div>
    <div id="slide-list" class="slide-list"></div>
  </section>
</main>

<footer class="bottom">
  <button id="show" class="display-button" type="button">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c5 0 9 4.5 10 7-1 2.5-5 7-10 7S3 14.5 2 12c1-2.5 5-7 10-7zm0 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg>
    <span class="label"></span>
  </button>
  <button id="blank" class="display-button" type="button">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v12H3V4zm2 2v8h14V6H5zm3 13h8v2H8v-2zM4.3 2.9l16.8 16.8-1.4 1.4L2.9 4.3l1.4-1.4z"/></svg>
    <span class="label"></span>
  </button>
</footer>

<div id="toast" class="toast" hidden></div>
<div id="offline" class="offline" hidden><span></span></div>

<script src="remote.js"></script>
</body>
</html>

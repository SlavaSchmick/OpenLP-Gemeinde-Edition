<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Song statistics</title>
<!--
  The song usage statistics of OpenLP: the songs which were sung in a period, the most sung first. The data, the texts
  and the settings are put into this page by openlp/plugins/songusage/lib/statistics.py (render_statistics_page). The
  page works without a network, also when it is saved as a file.
-->
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb; --accent: #2f6fde;
  --bar: #4f86ea; --bar-soft: #dce6f9; --chip: #eef0f3;
  --book-0: #2f6fde; --book-1: #d9480f; --book-2: #2b8a3e; --book-3: #7048e8; --book-4: #c2255c; --book-5: #0b7285;
}
html.dark {
  --bg: #1b1e24; --card: #252a32; --text: #e6e8ec; --muted: #9aa3b0; --line: #353b45; --accent: #6d9cf0;
  --bar: #5b8fe8; --bar-soft: #34445e; --chip: #303640;
  --book-0: #6d9cf0; --book-1: #f08a5d; --book-2: #69c07a; --book-3: #a08af5; --book-4: #ef6f9b; --book-5: #4fc1d1;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 20px 24px 32px; background: var(--bg); color: var(--text);
  font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
}
h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
.subtitle { color: var(--muted); margin-bottom: 16px; }
/* The browser engine of OpenLP doesn't know "gap" in flex layouts, so there are margins instead */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
.toolbar > * { margin: 0 18px 10px 0; }
.segmented { display: inline-flex; background: var(--chip); border-radius: 8px; padding: 3px; flex-wrap: wrap; }
.segmented button {
  border: 0; background: transparent; color: var(--text); font: inherit; padding: 5px 12px; border-radius: 6px;
  cursor: pointer;
}
.segmented button.active {
  background: var(--card); color: var(--accent); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .12);
}
.range { display: inline-flex; align-items: center; color: var(--muted); }
.range input { margin: 0 6px; }
.range input:first-child { margin-left: 0; }
input[type=date], input[type=search] {
  font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 6px;
  padding: 4px 8px;
}
html.dark input[type=date] { color-scheme: dark; }
input[type=search] { min-width: 280px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 16px 12px; }
table { width: 100%; border-collapse: collapse; }
td, th { padding: 7px 6px; text-align: left; vertical-align: middle; }
th { font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); }
tbody tr + tr td { border-top: 1px solid var(--line); }
td.rank { color: var(--muted); width: 36px; text-align: right; }
td.song { display: flex; align-items: center; }
td.count { width: 40%; }
.title { font-weight: 500; }
.badge {
  display: inline-block; flex: none; min-width: 50px; text-align: center; padding: 1px 6px; border-radius: 5px;
  font-size: 12px; font-weight: 600; color: #fff; margin-right: 10px;
}
.meter { display: flex; align-items: center; }
.meter b { min-width: 28px; text-align: right; margin-right: 10px; font-size: 15px; }
.meter .track { flex: 1; height: 10px; background: var(--bar-soft); border-radius: 5px; overflow: hidden; }
.meter .fill { height: 100%; background: var(--bar); border-radius: 5px; }
.empty { color: var(--muted); padding: 14px 0 6px; }
.notice { background: var(--card); border: 1px dashed var(--line); border-radius: 10px; padding: 28px; text-align: center; }
.notice h2 { font-size: 15px; margin: 0 0 6px; }
@media print {
  :root, html.dark {
    --bg: #ffffff; --card: #ffffff; --text: #1d2330; --muted: #6b7280; --line: #d5d9e0; --bar: #4f86ea;
    --bar-soft: #dfe7f8; --chip: #eef0f3; --book-0: #2f6fde; --book-1: #d9480f; --book-2: #2b8a3e;
    --book-3: #7048e8; --book-4: #c2255c; --book-5: #0b7285;
  }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #fff; padding: 0; }
  .toolbar { display: none; }
  .card { border: 0; padding: 0; }
  thead { display: table-row-group; }
  tr { break-inside: avoid; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
var DATA = /*DATA*/null;
var TEXTS = /*TEXTS*/null;
var SETTINGS = /*SETTINGS*/null;

DATA = DATA || {songs: [], events: []};
TEXTS = TEXTS || {};
SETTINGS = SETTINGS || {};

var state = {period: '12m', from: '', to: '', book: '', query: ''};

/** A translated text; "{name}" is replaced by the values */
function t(key, values) {
  var text = TEXTS[key] || key;
  Object.keys(values || {}).forEach(function (name) {
    text = text.split('{' + name + '}').join(values[name]);
  });
  return text;
}

function escapeHtml(text) {
  return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ---------------------------------------------------------------- dates */

function parseDate(text) {
  var parts = text.split('-');
  return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
}

function isoDate(date) {
  function pad(value) { return (value < 10 ? '0' : '') + value; }
  return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
}

function addDays(text, days) {
  var date = parseDate(text);
  date.setDate(date.getDate() + days);
  return isoDate(date);
}

function addMonths(text, months) {
  var date = parseDate(text);
  var day = date.getDate();
  date.setDate(1);
  date.setMonth(date.getMonth() + months);
  var last = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
  date.setDate(Math.min(day, last));
  return isoDate(date);
}

function formatDate(text) {
  return parseDate(text).toLocaleDateString(SETTINGS.language || undefined,
                                            {day: '2-digit', month: '2-digit', year: 'numeric'});
}

function today() {
  return SETTINGS.today || isoDate(new Date());
}

function firstDate() {
  return DATA.events.length ? DATA.events[0][0] : today();
}

/** The first and the last day of the selected period */
function periodRange() {
  var end = today();
  switch (state.period) {
    case '4w': return [addDays(end, -27), end];
    case '3m': return [addDays(addMonths(end, -3), 1), end];
    case '12m': return [addDays(addMonths(end, -12), 1), end];
    case 'year': return [end.slice(0, 4) + '-01-01', end];
    case 'all': return [firstDate() < end ? firstDate() : end, end];
    default:
      var from = state.from || firstDate();
      var to = state.to || end;
      return from <= to ? [from, to] : [to, from];
  }
}

/* ---------------------------------------------------------------- songs */

var bookColours = {};
(function () {
  var books = [];
  DATA.songs.forEach(function (song) {
    if (song.book && books.indexOf(song.book) === -1) { books.push(song.book); }
  });
  books.sort();
  books.forEach(function (book, index) { bookColours[book] = 'var(--book-' + (index % 6) + ')'; });
})();

function books() {
  return Object.keys(bookColours);
}

function songLabel(song) {
  return song.book ? song.book + song.number : '';
}

/** Whether a song is shown with the selected songbook and search */
function songMatches(song) {
  if (state.book && song.book !== state.book) { return false; }
  var query = state.query.trim().toLowerCase();
  if (!query) { return true; }
  var compact = query.replace(/\s+/g, '');
  if (song.book && /^[^\d\s]{0,3}\d+$/.test(compact)) {
    // A song number like "d203" or "203"
    var match = compact.match(/^([^\d]*)0*(\d+)$/);
    return (!match[1] || match[1] === song.book.toLowerCase()) && match[2] === song.number;
  }
  return song.title.toLowerCase().indexOf(query) !== -1 || song.authors.toLowerCase().indexOf(query) !== -1;
}

/** The songs which were sung in the period, the most sung first */
function ranking(from, to) {
  var counts = {};
  DATA.events.forEach(function (event) {
    if (event[0] >= from && event[0] <= to) { counts[event[1]] = (counts[event[1]] || 0) + 1; }
  });
  var entries = Object.keys(counts).map(function (key) { return {index: Number(key), count: counts[key]}; })
    .filter(function (entry) { return songMatches(DATA.songs[entry.index]); });
  entries.sort(function (a, b) {
    var songA = DATA.songs[a.index], songB = DATA.songs[b.index];
    return b.count - a.count || songA.book.localeCompare(songB.book) ||
      Number(songA.number || 0) - Number(songB.number || 0) || songA.title.localeCompare(songB.title);
  });
  var rank = 0, previous = null;
  entries.forEach(function (entry, position) {
    if (entry.count !== previous) { rank = position + 1; previous = entry.count; }
    entry.rank = rank;
  });
  return entries;
}

/* ---------------------------------------------------------------- rendering */

function renderToolbar(range) {
  var periods = [['4w', t('4 weeks')], ['3m', t('3 months')], ['12m', t('12 months')], ['year', t('This year')],
                 ['all', t('All')], ['custom', t('Period')]];
  var html = '<div class="toolbar"><div class="segmented">';
  periods.forEach(function (period) {
    html += '<button data-period="' + period[0] + '"' + (state.period === period[0] ? ' class="active"' : '') + '>' +
      escapeHtml(period[1]) + '</button>';
  });
  html += '</div><span class="range"><input type="date" id="from" value="' + range[0] + '"> – ' +
    '<input type="date" id="to" value="' + range[1] + '"></span>';
  if (books().length > 1) {
    html += '<div class="segmented"><button data-book=""' + (state.book ? '' : ' class="active"') + '>' +
      escapeHtml(t('All songbooks')) + '</button>';
    books().forEach(function (book) {
      html += '<button data-book="' + escapeHtml(book) + '"' + (state.book === book ? ' class="active"' : '') + '>' +
        escapeHtml(book) + '</button>';
    });
    html += '</div>';
  }
  html += '<input type="search" id="query" placeholder="' + escapeHtml(t('Search song or number, e.g. d203')) +
    '" value="' + escapeHtml(state.query) + '">';
  return html + '</div>';
}

function renderRanking(entries) {
  if (!entries.length) {
    return '<div class="card"><div class="empty">' + escapeHtml(t('No songs in this period.')) + '</div></div>';
  }
  var max = entries[0].count;
  var html = '<div class="card"><table><thead><tr><th></th><th>' + escapeHtml(t('Song')) + '</th><th>' +
    escapeHtml(t('Times sung')) + '</th></tr></thead><tbody>';
  entries.forEach(function (entry) {
    var song = DATA.songs[entry.index];
    var badge = song.book ? '<span class="badge" style="background:' + bookColours[song.book] + '">' +
      escapeHtml(songLabel(song)) + '</span>' : '';
    html += '<tr><td class="rank">' + entry.rank + '.</td><td class="song">' + badge + '<span class="title">' +
      escapeHtml(song.name) + '</span></td><td class="count"><div class="meter"><b>' + entry.count + '</b>' +
      '<div class="track"><div class="fill" style="width:' + (entry.count / max * 100) + '%"></div></div></div></td>' +
      '</tr>';
  });
  return html + '</tbody></table></div>';
}

function render() {
  var app = document.getElementById('app');
  var html = '<h1>' + escapeHtml(t('Most sung songs')) + '</h1>';
  if (!DATA.events.length) {
    app.innerHTML = html + '<div class="notice"><h2>' + escapeHtml(t('No songs have been sung yet')) + '</h2><div>' +
      escapeHtml(t('Every song which is shown live is counted.')) + '</div></div>';
    return;
  }
  var range = periodRange();
  html += '<div class="subtitle">' + escapeHtml(t('{from} to {to}', {from: formatDate(range[0]),
                                                                        to: formatDate(range[1])})) +
    (state.book ? ' · ' + escapeHtml(t('Songbook {book}', {book: state.book})) : '') +
    (state.query ? ' · ' + escapeHtml(t('Search: {query}', {query: state.query})) : '') + '</div>';
  html += renderToolbar(range) + renderRanking(ranking(range[0], range[1]));
  var focused = document.activeElement && document.activeElement.id;
  var selection = focused === 'query' ? document.activeElement.selectionStart : null;
  app.innerHTML = html;
  if (focused === 'query') {
    var query = document.getElementById('query');
    query.focus();
    query.setSelectionRange(selection, selection);
  }
}

document.addEventListener('click', function (event) {
  var target = event.target.closest('[data-period], [data-book]');
  if (!target) { return; }
  if (target.dataset.period) {
    if (target.dataset.period === 'custom') {
      var range = periodRange();
      state.from = range[0];
      state.to = range[1];
    }
    state.period = target.dataset.period;
  } else {
    state.book = target.dataset.book;
  }
  render();
});

document.addEventListener('change', function (event) {
  if (event.target.id === 'from' || event.target.id === 'to') {
    var range = periodRange();
    state.from = document.getElementById('from').value || range[0];
    state.to = document.getElementById('to').value || range[1];
    state.period = 'custom';
    render();
  }
});

document.addEventListener('input', function (event) {
  if (event.target.id === 'query') {
    state.query = event.target.value;
    render();
  }
});

if (SETTINGS.dark) { document.documentElement.classList.add('dark'); }
document.documentElement.lang = SETTINGS.language || 'en';
document.title = t('Most sung songs');
render();
</script>
</body>
</html>
